services:
  db:
    image: postgres:16-alpine
    container_name: rencloud-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: rencloud
      POSTGRES_PASSWORD: rencloud_dev_password
      POSTGRES_DB: rencloud
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rencloud"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rencloud-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://rencloud:rencloud_dev_password@db:5432/rencloud
    volumes:
      - ./app:/code/app
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
